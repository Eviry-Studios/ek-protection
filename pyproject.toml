[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ek-protection"
version = "1.0.0"
description = "Lightweight terminal-based antivirus daemon for Linux"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "EviRyKorp" }]
requires-python = ">=3.10"
keywords = ["antivirus", "security", "linux", "terminal", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "watchdog>=4.0.0",
    "bcrypt>=4.1.0",
    "psutil>=5.9.8",
    "aiofiles>=23.2.1",
    "click>=8.1.7",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
clamav = [
    "clamd>=1.0.2",
]

[project.scripts]
ekp = "ekprotection.main:main"
ekp-daemon = "ekprotection.daemon:run_daemon"

[project.urls]
Homepage = "https://github.com/Eviry-Studios/ek-protection"
Repository = "https://github.com/Eviry-Studios/ek-protection"
Issues = "https://github.com/Eviry-Studios/ek-protection/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ekprotection*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
